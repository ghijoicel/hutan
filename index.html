<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Relik Hutan Cahaya — CinemaX Adventure</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="wrap">
  <h1><span class="grad">Relik</span> Hutan Cahaya</h1>
  <p class="muted">Jelajahi hutan gelap, kumpulkan 3 kristal, temukan kunci, dan buka kuil kuno.</p>

  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Peta hutan petualangan. Gerakkan penjelajah dengan panah atau WASD."></canvas>
    <div class="hud" aria-live="polite">
      <span id="hHp" title="Nyawa"></span>
      <span id="hCr" title="Kristal"></span>
      <span id="hKey" title="Kunci"></span>
      <span id="hTime" title="Waktu"></span>
      <span class="sp"></span>
      <button class="ib" id="bMute" type="button" aria-label="Suara">🔊</button>
      <button class="ib" id="bFs" type="button" aria-label="Layar penuh">⛶</button>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="dpad" id="dpad" aria-hidden="true">
      <button data-d="up" type="button">▲</button><button data-d="left" type="button">◀</button>
      <button data-d="down" type="button">▼</button><button data-d="right" type="button">▶</button>
    </div>
    <div class="overlay" id="ov">
      <div class="panel">
        <h2 id="ovT"></h2><p id="ovP" class="muted"></p>
        <button class="btn" id="btn" type="button"></button>
        <ul class="keys muted small">
          <li><kbd>WASD</kbd>/<kbd>Panah</kbd> jalan · tombol layar di HP</li>
          <li><kbd>F</kbd> layar penuh · <kbd>P</kbd> jeda · <kbd>M</kbd> suara</li>
        </ul>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/engine.js"></script>
<script src="assets/js/game.js"></script>
</body>
</html>
